name: Daily video

on:
  schedule:
    - cron: "37 13 * * *"   # Short #1 — 13:37 UTC (7:07 pm IST)
    - cron: "13 17 * * *"   # Short #2 — 17:13 UTC (10:43 pm IST)
  workflow_dispatch:
    inputs:
      format:
        description: "long or short"
        default: "short"
      dry_run:
        description: "1 = build only, don't upload"
        default: "0"

permissions:
  contents: write

concurrency: daily-video

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core
          pip install -r requirements.txt

      - name: Pick format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "format=${{ inputs.format }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "13 17 * * *" ]; then
            echo "format=short" >> "$GITHUB_OUTPUT"; echo "dry=0" >> "$GITHUB_OUTPUT"
          else
            echo "format=short" >> "$GITHUB_OUTPUT"; echo "dry=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Make and upload video
        if: ${{ steps.fmt.outputs.format != 'short' || vars.ENABLE_SHORTS != '0' }}
        env:
          VIDEO_FORMAT: ${{ steps.fmt.outputs.format }}
          DRY_RUN: ${{ steps.fmt.outputs.dry }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'hi-IN-MadhurNeural' }}
        run: python -m pipeline.main

      - name: Keep a copy of the output (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: |
            out/**/final.mp4
            out/**/thumbnail.jpg
            out/**/package.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save topic history
        if: success()
        run: |
          git config user.name "automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git commit -m "Log video $(date -u +%F)" || echo "nothing to commit"
          git push
